  <script type="text/plain" id="source-md">> 论文：Ma et al., SkillClaw: Let Skills Evolve Collectively with Agentic Evolver, 2026  

> 分享重点：Skill 提取、Skill 进化及其实验证据

> 论文开源地址：https://github.com/AMAP-ML/SkillClaw

## 1. 项目背景与问题背景

### 1.1 项目背景

当前 AI Coding 平台积累了大量会话轨迹，但经验难以跨用户、跨时间复用，静态 Skill 也跟不上新工具和新失败模式的增长，因此关注 SkillClaw 提出的从交互中持续进化 Skill 的思路。

### 1.2 问题背景

当前 LLM Agent（如 OpenClaw）依赖可复用技能（skills）来执行复杂任务，但这些技能在部署后基本是静态的：

- 用户从中心化的技能市场安装技能，技能由人工维护
- 会话中发现的解决方案（如正确的参数格式、工具调用顺序、错误处理方式）只停留在当前会话，不会沉淀到技能库中
- 不同用户在重叠的任务空间里反复遇到相同的失败模式，却各自独立"重新发明轮子"
- 系统级别的知识无法累积，每个用户都在重复试错

本质矛盾：用户操作在重叠的任务空间中，系统却没有利用这些反复出现的经验来改进自身。

## 2. 论文试图解决的问题与核心创新

SkillClaw 面向多用户 Agent 生态，将分散的交互轨迹转化为共享证据，并通过 Agentic Evolver 创建、修改和验证 Skill。

### 2.1 论文试图解决的问题

论文聚焦于三个关键问题：

1. **证据聚合问题：** 如何将分散、异构的用户交互会话，转化为可用于跨用户推理的结构化证据？单个用户的交互信号太弱，难以区分通用改进和特例修复；只有聚合跨用户证据才能为稳定的技能进化提供基础。
2. **进化机制问题：** 如何自动诊断技能的成功模式和失败根因，并生成合理的技能更新？失败模式多种多样，不可能为每类问题预写更新规则。
3. **质量保证问题：** 如何确保技能更新是单调改进，即只接受真正的改进，而不会意外破坏已验证有效的行为？


### 2.2 论文的核心创新

围绕上述问题，论文的主要创新点包括：

1. **集体进化框架。** 首次在多用户 Agent 生态层面实现技能的集体进化。不同用户的交互轨迹被聚合为共享证据库，一个用户发现的改进可以传播给所有用户，形成系统级的知识积累。
2. **Agentic Evolver（智能进化体）。** 技能更新由一个自主 LLM Agent 通过开放式推理完成，而非预定义规则。进化体可以诊断根因、选择动作（改进 / 创建 / 跳过）、并直接编辑技能定义，能够处理未见过的失败模式。
3. **按技能分组的证据机制。** 会话按引用的技能分组后，同一个技能在不同用户、任务、环境下的表现差异天然形成对照实验，直接揭示技能在哪里有效、在哪里失效。无技能会话组则用来发现潜在的新技能缺口。
4. **验证驱动的单调部署。** 候选技能更新在夜间同环境下与当前最佳版本对比验证，只有表现更优才被接纳部署，保证技能池单调不退化。

## 3. 实现机制：从会话到技能进化的完整链路

SkillClaw 的核心是一条闭环链路：将异构会话转化为结构化证据，按 Skill 归组后由 Agentic Evolver 进行提取和进化，最后通过同环境验证决定是否部署。以下按这个流程展开。

形式化地，给定共享 Skill 集合 S 与会话集合 T：

`	ext
S' = Phi(S, T)
`

其中，Phi 表示由 Agentic Evolver 完成的证据分析和 Skill 更新过程。

整体构成"交互—证据—进化—验证—部署"的持续闭环：

`	ext
多用户交互 -> 会话收集 -> 证据聚合 -> Skill 提取与进化 -> 候选验证 -> 最佳 Skill 部署 -> 新一轮交互
`

### 3.1 会话作为进化证据

SkillClaw 不只分析最终回答，而是保存完整的行为链：

```text
用户任务 -> Agent 行动 -> 工具调用 -> 环境反馈 -> Agent 回答
```

这是因为多数 Skill 缺陷属于过程错误，例如：

- 工具参数或 API 地址错误；
- 操作步骤顺序不正确；
- 缺少输入、环境或输出检查；
- 工具失败后进行无效重试；
- 最终结果正确，但过程不稳定或成本过高。

论文进一步提取 Skill 引用、工具错误和质量分数等元数据，将异构会话转化为可比较的结构化证据。

### 3.2 会话聚合与 Skill 归属

设 `K_i` 为会话 `tau_i` 实际引用的 Skill 集合，则某个 Skill 的证据组为：

```text
G(s) = { tau_i | s in K_i }
```

分组规则如下：

- 引用 Skill A 的会话进入 `G(A)`；
- 同时引用 A、B 的会话同时进入两个组；
- 未引用任何 Skill 的会话进入 `G(empty)`。

需要注意，Skill 被注入上下文并不等于被实际使用；SkillClaw 主要依据实际读取（调用读取工具）或修改记录建立归属。论文也未充分解决多 Skill 会话的贡献归因和项目级知识隔离问题。

### 3.3 Skill 提取

Skill 提取主要发生在无 Skill 会话集合中：

```text
无 Skill 会话集合 -> 重复模式发现 -> 候选 Skill
```

Evolver 需要判断：

- 多个会话是否重复出现同一种解决程序；
- 该程序是否具有明确的触发条件与操作步骤；
- 是否可能在未来任务中复用；
- 是否已被现有 Skill 覆盖；
- 当前证据是否足以支持创建，而非来自偶然案例。

对应动作是 **Create** 或 **Skip**。单次成功经验不必然构成 Skill，只有可重复、可教导且具有复用价值的程序才适合沉淀。

### 3.4 Skill 进化

对于引用已有 Skill 的会话集合 `G(s)`，Evolver 联合分析成功和失败轨迹：

```text
s' = phi(s, <G_>success(s)</G_>, G_failure(s))
```

- 成功会话定义应当保留的不变量；
- 失败会话定义需要修正的行为；
- 不稳定会话揭示 Skill 的适用边界；
- 工具错误揭示参数、环境或调用协议问题。

主要进化动作包括：

| 动作 | 含义 |
|---|---|
| Refine | 修正或增强现有 Skill |
| Create | 创建当前 Skill 未覆盖的新能力 |
| Skip | 证据不足，保持现状 |

`Skip` 是一种保守决策：系统不应为了表现出“持续学习”而强制修改 Skill。

### 3.5 Agentic Evolver

Agentic Evolver 在固定约束框架中进行开放式分析：

1. 读取结构化会话、当前 Skill 和历史版本；
2. 比较成功、失败和工具错误模式；
3. 判断证据是否跨会话重复出现；
4. 选择 Refine、Create 或 Skip（设置动作限制）；
5. 生成候选 Skill，并记录版本证据和修改理由。

其特点是约束框架限定输入、输出和可执行动作，而 LLM Agent 负责诊断具体问题，不需要为每类失败预先编写更新规则。

> 实现逻辑：Agent + Skill + 提示词

### 3.6 候选验证与最佳技能池

Skill 文本发生变化并不能证明进化有效。论文在相同环境和同一个验证任务输入下比较当前最佳版本与候选版本：

```text
当前最佳 Skill  与候选 Skill 对比
```

只有候选版本表现更好时才予以**接纳**；否则予以**拒绝**，继续部署当前最佳技能池。该机制用于降低错误经验、局部修复和 Skill 退化对用户侧的影响。

完整闭环为：

```text
多用户交互
→ 会话收集
→ 证据聚合
→ Skill 提取与进化
→ 候选 Skill 验证
→ 最佳 Skill 部署
→ 新一轮用户交互
```

## 4. 实验设计

论文使用 WildClawBench：

- 60 个复杂任务、6 个能力领域；
- 完整 Linux 工具环境；
- 文本、代码、图像和视频等多模态输入；
- 单任务包含 15–50 个步骤；
- 每个任务由 3–27 个指标聚合评分；
- 关键约束违反时可能直接记为零分。

实验模拟 8 个并发用户和 6 个昼夜轮次。白天使用当前最佳技能池完成任务，夜间聚合会话、生成候选并验证。第 1 天是基线，后续 5 天使用前一晚通过验证的 Skill。执行、进化和验证均使用 Qwen3-Max。

## 6. 实验证据二：候选接纳轨迹

表 4–7 展示了夜间候选并非全部部署：接纳表示候选优于当前最佳版本并进入下一轮最佳技能池，拒绝表示候选未超过当前版本、不会部署到用户侧。

| 类别 | 主要被接纳的变化 | 后续轨迹 |
|---|---|---|
| 社交与协作交互 | 第 1 个夜间轮次：将跨部门 Slack 总结重写为严格有序流程 | 后续会议协调、可行性分析候选均未超过当前最佳版本 |
| 搜索与信息检索 | 第 1 个夜间轮次：增加输入文件存在性检查；第 3 个夜间轮次：确认当前版本仍为最佳 | 更复杂的路径恢复、多模态验证和检索规划候选被拒绝 |
| 创意内容综合 | 第 1 个夜间轮次：验证 `/tmp_workspace` 输入与环境 | 第 2–6 个夜间轮次的多模态流水线候选均未带来进一步提升 |
| 安全与对齐 | 第 1–3 个夜间轮次：增加 Git 认证失败后的备用方案和正确的仓库克隆流程；第 4 个夜间轮次确认当前最佳 | 第 5–6 个夜间轮次的细化版本没有超过当前版本 |

这组结果进一步说明说明 SkillClaw 的机制：进化不是无条件累积规则，而是不断提出候选，再由 validator 控制部署。

## 7. 实验证据三：受控验证

论文使用三个自定义测试任务隔离常见失败模式，比较单轮进化前后的表现：

| 测试任务 | 进化前 | 进化后 | 绝对提升 |
|---|---:|---:|---:|
| 基础信息提取 | 21.7% | 69.6% | +47.8 |
| 截止时间解析 | 41.1% | 48.0% | +6.9 |
| 保存报告 | 28.3% | 100.0% | +71.7 |
| **平均** | **30.4%** | **72.5%** | **+42.1** |

受控实验表明，Skill 进化更容易改善步骤明确、可被规则化的执行问题，例如 API 配置、输出路径和工具调用顺序；对于需要理解隐含意图、模糊时间和上下文关系的语言推理任务，Skill 只能提供分析框架，最终效果仍主要取决于底层模型能力。

> 更通俗地说：Skill 擅长解决“Agent 不知道正确流程”的问题，但不一定能解决“Agent 看不懂这句话”的问题。

## 8. 本地自部署补充实验

本地实验主要回答两个问题：**SkillClaw 能否根据多条会话修改 Skill？修改后的 Skill 是否真的比原版本更有效？**

实验选择“缺陷竞争假设消歧”作为任务，即面对多个可能根因时，要求 Agent 保留候选、补充证据，并避免过早修改代码。

### 13.1 Skill 是如何进化的

实验先准备 6 个不同缺陷场景，包括总线边界、PCIe 链路、缓存一致性、规格版本、电源瞬态和旧构建产物。每个场景都通过多轮对话逐步补充证据。

```text
6 个缺陷分析会话
→ 尝试从零提取 Skill
→ 提供一个只有 4 条通用规则的种子 Skill（v1）
→ 加入具体失败反馈
→ SkillClaw 生成改进版本（v2）
```

| 阶段 | 做了什么 | 观察到的结果 |
|---|---|---|
| 从零提取 | 直接让 SkillClaw 分析 6 个没有 Skill 归属的会话 | 场景差异较大，系统没有创建新 Skill |
| 引入种子 Skill | 提供一个简单的 v1，并通过回放数据表明这些会话与 v1 有关 | 系统完成了会话归组，但认为现有证据不足以修改 v1 |
| 加入失败反馈 | 为每个会话补充一条离线评审，明确指出 v1 遗漏的检查 | 系统将重复缺口合并到 v1，生成 v2 |

v2 新增了事务边界、事件时间线、数据路径分层、规格时效、物理因果证据以及构建产物身份等检查。需要说明的是，Skill 归属和失败评审是为了控制实验变量而加入的模拟标签，不是自然产生的线上用户反馈。

### 13.2 如何判断 v2 是否更有效

仅看到 Skill 文本增加了规则，还不能证明进化有效。实验另外准备了 3 类没有用于进化的测试任务，让同一个模型分别使用 v1 和 v2 回答；每个任务、每个版本重复 5 次，共执行 30 次。两组实验唯一变化的是 Skill 版本。

评分主要检查四件事：是否选择了最有区分力的下一项检查、是否请求了必要证据、是否阻止过早修改代码，以及是否保留了多个竞争假设。

| 测试任务 | v1 | v2 | 绝对提升 |
|---|---:|---:|---:|
| IOMMU 边界检查规划 | 91.0% | 100.0% | +9.0 |
| 时钟与复位因果规划 | 24.0% | 77.0% | +53.0 |
| 固件产物身份核验 | 89.0% | 100.0% | +11.0 |
| **平均** | **68.0%** | **92.3%** | **+24.3** |

### 13.3 实验说明了什么

结果显示，v2 的平均得分比 v1 高 24.3 个百分点，三个测试任务均有提升，因此在本次受控条件下，v2 可以替代 v1。提升主要来自 Agent 更准确地选择下一项检查并请求必要证据。

实验同时说明，SkillClaw 并不是“放入几条会话就会自动得到 Skill”：会话需要能够被正确归组，还需要包含足以说明现有 Skill 缺口的重复反馈。本实验验证了流程可行和候选版本有效，但尚未证明在大规模自然会话中也能稳定完成同样的提取与进化。

完整实验过程、评分口径和原始结果见[本地实验报告](experiments/defect-hypothesis-disambiguation/EXPERIMENT_REPORT.md)。

## 9. 局限性与开放问题

本地自部署和模拟实验暴露出以下问题：

| 问题 | 本地观察 | 直接影响 |
|---|---|---|
| 缺少项目隔离 | 不同项目的同名 Skill 会在同一共享组内聚合 | 项目经验可能相互污染 |
| Skill 使用记录可能缺失 | 会话归属依赖 Skill 的读取或修改记录，但不同客户端未必完整上报 | 实际使用过 Skill 的会话可能被误判为无 Skill 会话 |
| 多 Skill 贡献难以归因 | 一个会话调用多个 Skill 时，会同时进入多个 Skill 组 | 成功或失败可能归因给无关 Skill |
| Skill 提取依赖聚类质量 | 无 Skill 会话场景差异较大时，系统难以发现统一模式 | 离线提取前需要可靠的任务聚类 |
| 候选判断依赖反馈和评分 | 本地实验需要明确失败反馈才能进化，且自动会话评分只有 2/6 成功解析 | 候选版本可能被错误跳过或接纳 |
| 数据治理尚未覆盖 | 会话可能包含源码、内部路径、账号和业务知识 | 共享前需要解决脱敏、权限、审计和回滚 |

## 10. 总结

SkillClaw 将静态 Skill 库转化为一个基于交互证据持续更新的程序性知识系统。其关键思想不是简单地从对话生成 Markdown，而是：

1. 保存能够反映因果过程的完整 Agent 轨迹；
2. 按 Skill 使用关系聚合跨会话证据；
3. 从无 Skill 会话中发现新程序；
4. 联合成功和失败轨迹优化已有 Skill；
5. 通过同环境验证决定候选是否进入最佳技能池。

    function isTableDivider(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);

    function parseTable(lines, start) {
      const rows = [];
      let i = start;
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        rows.push(lines[i]);
        i += 1;
      }
      if (rows.length < 2 || !isTableDivider(rows[1])) return null;
      const split = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
      const header = split(rows[0]);
      const body = rows.slice(2).map(split);
      const thead = `<thead><tr>${header.map(cell => `<th>${inlineMd(cell)}</th>`).join("")}</tr></thead>`;
      const tbody = `<tbody>${body.map(row => `<tr>${row.map(cell => `<td>${inlineMd(cell)}</td>`).join("")}</tr>`).join("")}</tbody>`;
      return { html: `<div class="table-scroll"><table>${thead}${tbody}</table></div>`, next: i };

    function parseMarkdown(md) {
      const lines = md.split(/\r?\n/);
      const html = [];
      let i = 0;
      let inCode = false;
      let code = [];
      let paragraph = [];
      let list = null;

      function flushParagraph() {
        if (paragraph.length) {
          html.push(`<p>${inlineMd(paragraph.join(" "))}</p>`);
          paragraph = [];
        }
      }

      function flushList() {
        if (list) {
          html.push(`<${list.type}>${list.items.map(item => `<li>${inlineMd(item)}</li>`).join("")}</${list.type}>`);
          list = null;
        }
      }

      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line.trim())) {
          flushParagraph();
          flushList();
          if (!inCode) {
            inCode = true;
            code = [];
          } else {
            html.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
            inCode = false;
          }
          i += 1;
          continue;
        }
        if (inCode) {
          code.push(line);
          i += 1;
          continue;
        }
        if (!line.trim()) {
          flushParagraph();
          flushList();
          i += 1;
          continue;
        }
        const table = parseTable(lines, i);
        if (table) {
          flushParagraph();
          flushList();
          html.push(table.html);
          i = table.next;
          continue;
        }
        const image = line.match(/^!\[([^\]]*)\]\(([^)]+)\)/);
        if (image) {
          flushParagraph();
          flushList();
          html.push(`<img src="${escapeHtml(image[2])}" alt="${escapeHtml(image[1])}">`);
          i += 1;
          continue;
        }
        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          html.push(`<h${level}>${inlineMd(heading[2])}</h${level}>`);
          i += 1;
          continue;
        }
        const quote = line.match(/^>\s?(.*)$/);
        if (quote) {
          flushParagraph();
          flushList();
          const quoteLines = [quote[1]];
          i += 1;
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quoteLines.push(lines[i].replace(/^>\s?/, ""));
            i += 1;
          }
          html.push(`<blockquote>${quoteLines.map(q => `<p>${inlineMd(q)}</p>`).join("")}</blockquote>`);
          continue;
        }
        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (bullet || ordered) {
          flushParagraph();
          const type = bullet ? "ul" : "ol";
          if (!list || list.type !== type) {
            flushList();
            list = { type, items: [] };
          }
          list.items.push((bullet || ordered)[1]);
          i += 1;
          continue;
        }
        paragraph.push(line.trim());
        i += 1;
      }
      flushParagraph();
      flushList();
      return html.join("\n");
    }

        <aside class="toc">
          <p class="toc-title">章节导航</p>
          ${slides.map((slide, i) => `<button type="button" data-target="${i}" class="${i === currentIndex ? "active" : ""}">${String(i + 1).padStart(2, "0")} · ${escapeHtml(slide.title)}</button>`).join("")}
        </aside>`;
    }

    function speakerNotes(slide) {
      if (slide.cover) {
        return `
          <h2>讲述提示</h2>
          <p>开场先讲清楚这不是普通的 Skill 市场论文，而是把多用户交互轨迹变成可验证 Skill 更新的系统。</p>
          <p>建议用一句话铺垫：静态 Skill 最大的问题不是不会写，而是不会从长期使用中自己变好。</p>`;
      }
      const plain = (slide.source || "")
        .replace(/^#{1,4}\s+/gm, "")
        .replace(/!\[[^\]]*\]\([^)]+\)/g, "")
        .replace(/\|/g, " ")
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .slice(0, 12);
      return `<h2>讲述提示 / 原文线索</h2>${plain.map(line => `<p>${inlineMd(line)}</p>`).join("")}`;
    }

    function renderSlideShell(slide, i) {
      if (slide.cover) {
        return `<section class="slide active" data-title="${escapeHtml(slide.title)}">${slide.html}</section>`;
      }
      return `
        <section class="slide" data-title="${escapeHtml(slide.title)}">
          <header class="topbar">
            <h1>${escapeHtml(slide.title)}</h1>
            <span class="chapter-pill">${String(i + 1).padStart(2, "0")} / ${slides.length}</span>
          </header>
          <div class="slide-grid">
            ${makeToc(i)}
            <div class="content-wrap">
              <article class="content md">
                <div class="key-points">
                  <div class="key-point"><strong>保留原文</strong><span>当前页直接由 Markdown 章节渲染。</span></div>
                  <div class="key-point"><strong>适合讲解</strong><span>长内容可在页面内滚动查看。</span></div>
                  <div class="key-point"><strong>结构定位</strong><span>左侧目录可跳转到任意章节。</span></div>
                </div>
                ${slide.html}
              </article>
              <aside class="speaker">${speakerNotes(slide)}</aside>
            </div>
          </div>
          <footer class="footer"><span>SkillClaw 论文分享 · Markdown 保留版</span><span>${escapeHtml(slide.chapter)}</span></footer>
        </section>`;
    }

    function renderArticle() {
      const toc = rawSlides.map((slide, i) => {
        const id = `section-${i}`;
        return `<button type="button" data-anchor="${id}">${String(i + 1).padStart(2, "0")} · ${escapeHtml(slide.title)}</button>`;
      }).join("");
      const articleHtml = parseMarkdown(source).replace(/<h2>/g, (_match, offset) => {
        const before = parseMarkdown(source).slice(0, offset);
        const count = (before.match(/<h2>/g) || []).length;
        return `<h2 id="section-${count}">`;
      });
      return `
        <div class="article-page">
          <aside class="article-toc">
            <h2>目录</h2>
            ${toc}
          </aside>
          <main class="article-main">
            <section class="article-hero">
              <div>
                <div class="chapter-pill">Paper Share · 2026</div>
                <h1>SkillClaw</h1>
                <p>Let Skills Evolve Collectively with Agentic Evolver</p>
                <p><strong>分享重点：</strong>Skill 提取、Skill 进化及其实验证据</p>
                <p><strong>阅读方式：</strong>这是完整 Markdown 内容的居中网页版，适合边滚动边讲。</p>
              </div>
              <img src="skillclaw_main.png" alt="SkillClaw overview">
            </section>
            <article class="article-card md">${articleHtml}</article>
          </main>
        </div>`;
    }

    deck.innerHTML = renderArticle();
    let activeIndex = 0;

    function activate(index) {
      activeIndex = Math.min(Math.max(index, 0), slides.length - 1);
      document.querySelectorAll(".slide").forEach((slide, i) => slide.classList.toggle("active", i === activeIndex));
      counter.textContent = `${activeIndex + 1} / ${slides.length}`;
      bar.style.width = `${((activeIndex + 1) / slides.length) * 100}%`;
      document.title = `${slides[activeIndex].title} · SkillClaw 论文分享`;
      document.querySelectorAll(".toc button").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.target) === activeIndex);
      });
    }

    deck.addEventListener("click", (event) => {
      const anchor = event.target.closest("[data-anchor]");
      if (anchor) {
        document.getElementById(anchor.dataset.anchor)?.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      const target = event.target.closest("[data-target]");
      if (target) activate(Number(target.dataset.target));
    });

    prev.addEventListener("click", () => activate(activeIndex - 1));
    next.addEventListener("click", () => activate(activeIndex + 1));

    document.addEventListener("keydown", (event) => {
      const active = document.querySelector(".slide.active .content");
      if ((event.key === "ArrowDown" || event.key === "j") && active) {
        active.scrollBy({ top: 80, behavior: "smooth" });
        return;
      }
      if ((event.key === "ArrowUp" || event.key === "k") && active) {
        active.scrollBy({ top: -80, behavior: "smooth" });
        return;
      }
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        activate(activeIndex + 1);
      }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) {
        event.preventDefault();
        activate(activeIndex - 1);
      }
      if (event.key === "Home") {
        event.preventDefault();
        activate(0);
      }
      if (event.key === "End") {
        event.preventDefault();
        activate(slides.length - 1);
      }
    });

    let touchStart = null;
    document.addEventListener("pointerdown", (event) => { touchStart = event.clientX; });
    document.addEventListener("pointerup", (event) => {
      if (touchStart === null) return;
      const dx = event.clientX - touchStart;
      if (Math.abs(dx) > 90) activate(activeIndex + (dx < 0 ? 1 : -1));
      touchStart = null;
    });

    activate(0);
  </script>
</body>
</html>
